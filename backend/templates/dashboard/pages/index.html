{% extends 'dashboard/LayoutMain.html' %}
{% load static %}
{% block content %}


    <div class="pagetitle mb-4">
      <h1 class="fw-bold text-dark">Overview</h1>
      <nav>
        <ol class="breadcrumb mt-2">
          <li class="breadcrumb-item"><a href="{% url 'index' %}">Home</a></li>
          <li class="breadcrumb-item active">Dashboard</li>
        </ol>
      </nav>
    </div>

    <div class="row mt-4">
      {% for card in dashboard_cards %}
      <div class="col-xl-3 col-lg-4 col-md-6 col-sm-12 mb-4">
        <a href="{{ card.url }}" class="text-decoration-none">
          <div class="card border-0 shadow-sm modern-card h-100 text-center border-0 modern-card rounded-4">
            <div class="card-body d-flex flex-column justify-content-center align-items-center py-5">
              <div class="icon-wrapper mb-3 rounded-circle d-flex align-items-center justify-content-center shadow-sm">
                <i class="{{ card.icon }} dash-icon text-primary" style="font-size: 2.2rem;"></i>
              </div>
              <h6 class="text-uppercase text-muted mb-2 fw-bold" style="font-size: 0.85rem; letter-spacing: 0.5px;">{{ card.title }}</h6>
              <h2 class="mb-0 text-dark fw-bolder">{{ card.count }}</h2>
            </div>
          </div>
        </a>
      </div>
      {% endfor %}
    </div>





<a href="#" class="back-to-top d-flex align-items-center justify-content-center rounded-circle shadow-sm">
  <i class="bi bi-arrow-up-short"></i>
</a>
{% endblock %}
