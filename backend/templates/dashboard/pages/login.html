{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waves CMS - Login</title>

    <link rel="shortcut icon" href="{% static 'dashboard/img/favicon.png' %}" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" />
    <link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}" />

    <style>
      :root {
        --primary: #046bd2;
        --primary-dark: #014e9a;
        --primary-light: #e0f0fe;
        --background: #f0f5fa;
        --background-dark: #0f172a;
        --slate-dark: #1e293b;
        --slate-body: #334155;
        --slate-light: #64748b;
        --slate-border: #e2e8f0;
        --white: #ffffff;
      }

      body {
        font-family: 'Poppins', sans-serif !important;
        background-color: var(--background);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      .login-container {
        width: 100%;
        max-width: 960px;
        background: var(--white);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        overflow: hidden;
        border: 1px solid rgba(0, 0, 0, 0.03);
      }

      .barnd-sidebar p {
        color: #ffffff !important;
      }

      .brand-sidebar {
        background-color: var(--primary);
        padding: 45px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 520px;
        position: relative;
      }

      .brand-sidebar::after {
        content: '';
        position: absolute;
        bottom: 0;
        right: 0;
        width: 250px;
        height: 250px;
        background: radial-gradient(circle, rgba(4, 107, 210, 0.15) 0%, transparent 70%);
        pointer-events: none;
        z-index: 1;
      }

      .brand-logo-wrapper {
        z-index: 2;
      }

      .brand-logo {
        max-height: 70px;
        object-fit: contain;
        transform: scale(1.3);
        transform-origin: center center;
      }

      .brand-welcome-msg {
        margin-top: 50px;
        margin-bottom: auto;
        z-index: 2;
      }

      .brand-welcome-title {
        font-size: 2.2rem;
        font-weight: 700;
        line-height: 1.3;
        margin-bottom: 16px;
        letter-spacing: -0.5px;
      }

      .brand-welcome-desc {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.6;
        font-weight: 400;
      }

      .brand-footer {
        font-size: 11px;
        color: #64748b;
        z-index: 2;
      }

      .form-panel {
        padding: 55px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .form-title {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--slate-dark);
        margin-bottom: 6px;
        letter-spacing: -0.5px;
        text-align: start;
      }

      .form-subtitle {
        color: var(--slate-light);
        font-size: 14px;
        margin-bottom: 35px;
        text-align: start;
      }

      .form-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--slate-light);
        letter-spacing: 0.8px;
        margin-bottom: 8px;
      }

      .input-group {
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--slate-border);
        background: #f8fafc;
        transition: all 0.2s ease;
      }

      .input-group:focus-within {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(4, 107, 210, 0.1);
        background: var(--white);
      }

      .input-group-text {
        background: transparent;
        border: none;
        color: var(--slate-light);
        padding-left: 16px;
        font-size: 16px;
      }

      .form-control {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 12px 14px;
        font-size: 14px;
        color: var(--slate-dark);
      }

      .form-control::placeholder {
        color: #94a3b8;
      }

      .btn-primary {
        background-color: var(--primary);
        border: none;
        border-radius: 10px;
        padding: 14px;
        font-size: 15px;
        font-weight: 600;
        width: 100%;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(4, 107, 210, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-primary:hover {
        background-color: var(--primary-dark);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(4, 107, 210, 0.3);
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-primary.loading {
        pointer-events: none;
        color: transparent;
        position: relative;
      }

      .btn-primary.loading::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        top: 50%;
        left: 50%;
        margin-left: -10px;
        margin-top: -10px;
        border: 2px solid #ffffff;
        border-radius: 50%;
        border-top-color: transparent;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @media (max-width: 768px) {
        .brand-sidebar {
          min-height: auto;
          padding: 35px;
        }
        .brand-welcome-msg {
          margin-top: 30px;
        }
        .form-panel {
          padding: 35px;
        }
      }
    </style>
  </head>
  <body>

    <div class="login-container">
      <div class="row g-0">
        <!-- Left Brand Column -->
        <div class="col-md-6 flex-column d-flex">
          <div class="brand-sidebar h-100">
            <div class="brand-logo-wrapper">
              <img src="{% static 'dashboard/img/logo.png' %}" class="brand-logo" alt="Waves Logo" />
            </div>
          </div>
        </div>

        <!-- Right Form Column -->
        <div class="col-md-6 flex-column d-flex">
          <div class="form-panel h-100">
            <h2 class="form-title">Waves CMS Log In</h2>
            <p class="form-subtitle">Enter your credentials to access the CMS.</p>

            <form method="post" id="loginForm">
              {% csrf_token %}

              <div class="mb-3">
                <label for="id_username" class="form-label">Username</label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="bi bi-person"></i>
                  </span>
                  <input
                    type="text"
                    name="username"
                    class="form-control"
                    id="id_username"
                    placeholder="Enter your username"
                    required
                  />
                </div>
              </div>

              <div class="mb-4">
                <label for="id_password" class="form-label">Password</label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                  </span>
                  <input
                    type="password"
                    name="password"
                    class="form-control"
                    id="id_password"
                    placeholder="Enter your password"
                    required
                  />
                </div>
              </div>
              <button type="submit" class="btn btn-primary" id="loginBtn">
                Sign In <i class="bi bi-arrow-right"></i>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <script>
      toastr.options = {
        "closeButton": true,
        "progressBar": true,
        "positionClass": "toast-top-right",
        "timeOut": "4000"
      };

      // Toastr notice helper

      {% if error %}
        toastr.error("{{ error|escapejs }}");
      {% endif %}

      document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', function () {
          submitBtn.classList.add('loading');
          submitBtn.disabled = true;
        });
      });
    </script>
  </body>
</html>
